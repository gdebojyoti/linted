<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library — list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;color:#1A1A18;background:#F6F6F3}
a{color:#17784A}a:hover{color:#0F5E39}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 940px; display: flex; flex-direction: column; background: #F6F6F3; font-family: 'Geist', system-ui, sans-serif; color: #1A1A18; overflow: hidden">

<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 20px; background: #FFFFFF; border-bottom: 1px solid #E3E3DE">
<div style="display: flex; align-items: center; gap: 8px">
<div style="width: 24px; height: 24px; border-radius: 6px; background: #17784A; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></div>
<span style="font-family: 'Geist Mono', monospace; font-size: 15px; font-weight: 600; letter-spacing: -0.02em">linted</span>
</div>
<div style="width: 1px; height: 20px; background: #E3E3DE"></div>
<span style="font-size: 13px; font-weight: 600">Library</span>
<span style="flex-grow: 1"></span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5F5F58"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8"></path><path d="M12 16v4"></path></svg>Saved in this browser</span>
</header>

<main style="flex-grow: 1; min-height: 0; display: flex; justify-content: center; padding: 40px 64px 0">
<div style="width: 1120px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Library</h1>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #6B6B64">6 resumes · most recently edited first</span>
</div>
<span style="flex-grow: 1"></span>
<label style="position: relative; display: flex; align-items: center">
<span style="position: absolute; left: 10px; color: #8F8F88; display: flex"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></span>
<input type="search" aria-label="Search resumes by title" placeholder="Search by title" style="width: 280px; height: 38px; box-sizing: border-box; border: 1px solid #D9D9D3; border-radius: 7px; padding: 0 12px 0 34px; font-family: inherit; font-size: 13px; color: #1A1A18; background: #FFFFFF">
</label>
<button style="height: 38px; padding: 0 16px; display: flex; align-items: center; gap: 8px; border: 1px solid #17784A; background: #17784A; border-radius: 7px; font-size: 13px; font-weight: 500; color: #FFFFFF; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>New resume</button>
</div>

<div style="background: #FFFFFF; border: 1px solid #E3E3DE; border-radius: 10px; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 190px 190px 112px; align-items: center; height: 40px; padding: 0 12px 0 20px; border-bottom: 1px solid #EFEFEA; font-size: 12px; font-weight: 500; color: #5F5F58">
<span>Resume title</span>
<span style="display: flex; align-items: center; gap: 4px; color: #1A1A18">Last edited<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M6 13l6 6 6-6"></path></svg></span>
<span>Created</span>
<span></span>
</div>

<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 190px 190px 112px; align-items: center; min-height: 60px; padding: 0 12px 0 20px; border-bottom: {{r.border}}; background: {{r.bg}}">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; min-width: 0; text-decoration: none; color: #1A1A18">
<span style="width: 28px; height: 36px; flex-shrink: 0; box-sizing: border-box; border: 1px solid #D9D9D3; border-radius: 3px; background: #FFFFFF; padding: 5px 4px; display: flex; flex-direction: column; gap: 2px"><span style="height: 3px; width: 12px; background: #1A1A18; border-radius: 1px"></span><span style="height: 2px; width: 16px; background: #D9D9D3; border-radius: 1px"></span><span style="height: 2px; width: 8px; background: #17784A; border-radius: 1px; margin-top: 2px"></span><span style="height: 2px; width: 18px; background: #E3E3DE; border-radius: 1px"></span><span style="height: 2px; width: 14px; background: #E3E3DE; border-radius: 1px"></span></span>
<span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 11.5px; color: #6B6B64">{{r.meta}}</span>
</span>
</a>
<span style="font-size: 13px; color: #1A1A18">{{r.edited}}</span>
<span style="font-size: 13px; color: #5F5F58">{{r.created}}</span>
<div style="display: flex; justify-content: flex-end; gap: 2px">
<button aria-label="Duplicate {{r.title}}" title="Duplicate" style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 6px; color: #5F5F58; cursor: pointer; padding: 0"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg></button>
<button onClick="{{r.toggle}}" aria-label="More actions for {{r.title}}" aria-expanded="{{r.expanded}}" style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: 0; background: {{r.menuBg}}; border-radius: 6px; color: #5F5F58; cursor: pointer; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></button>
</div>
<sc-if value="{{r.open}}" hint-placeholder-val="{{ false }}">
<div role="menu" style="position: absolute; right: 12px; top: 50px; width: 200px; padding: 4px; background: #FFFFFF; border: 1px solid #D9D9D3; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); display: flex; flex-direction: column; z-index: 5">
<button role="menuitem" style="height: 34px; padding: 0 10px; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; border-radius: 5px; font-size: 13px; color: #1A1A18; cursor: pointer; text-align: left"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg>Rename</button>
<button role="menuitem" style="height: 34px; padding: 0 10px; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; border-radius: 5px; font-size: 13px; color: #1A1A18; cursor: pointer; text-align: left"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>Duplicate</button>
<button role="menuitem" style="height: 34px; padding: 0 10px; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; border-radius: 5px; font-size: 13px; color: #1A1A18; cursor: pointer; text-align: left"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg>Export PDF</button>
<div style="height: 1px; background: #EFEFEA; margin: 4px 0"></div>
<button role="menuitem" style="height: 34px; padding: 0 10px; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; border-radius: 5px; font-size: 13px; color: #B42318; cursor: pointer; text-align: left"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M6 7l1 13h10l1-13"></path><path d="M9 7V4h6v3"></path></svg>Delete resume</button>
</div>
</sc-if>
</div>
</sc-for>
</div>

<div style="display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: #5F5F58">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg>
<span>Your resumes are saved in this browser only. Clearing site data, or switching browser or device, will not bring them with you.</span>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"openMenu":{"editor":null,"tsType":"number"},"$preview":{"width":1440,"height":940}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var open = st.open === undefined ? (this.props.openMenu === undefined ? 1 : this.props.openMenu) : st.open;
    var R = [
      { title: 'Backend — payments v2', meta: 'Ledger · 6 of 7 sections', edited: '2 minutes ago', created: '14 Sep 2026' },
      { title: 'Platform infra — Series B startups', meta: 'Ledger · 5 of 6 sections', edited: 'Yesterday, 18:40', created: '9 Sep 2026' },
      { title: 'Backend — payments v1', meta: 'Ledger · 6 of 6 sections', edited: '3 days ago', created: '2 Sep 2026' },
      { title: 'Staff engineer — long form', meta: 'Ledger · 8 of 8 sections', edited: '12 Sep 2026', created: '12 Sep 2026' },
      { title: 'Frontend-leaning, one page', meta: 'Ledger · 4 of 6 sections', edited: '28 Aug 2026', created: '20 Aug 2026' },
      { title: 'Untitled resume', meta: 'Ledger · all sections empty', edited: '2 Aug 2026', created: '2 Aug 2026' }
    ];
    return {
      rows: R.map(function (r, i) {
        var o = open === i;
        return Object.assign({}, r, {
          open: o, expanded: o ? 'true' : 'false',
          menuBg: o ? '#F2F2EE' : 'transparent',
          bg: '#FFFFFF',
          border: i === R.length - 1 ? '0 solid transparent' : '1px solid #EFEFEA',
          toggle: function () { self.setState({ open: o ? -1 : i }); }
        });
      })
    };
  }
}
</script>
</body>
</html>
